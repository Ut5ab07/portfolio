    <script>
      // Edition choice at /. The host already sends phones and tablets the mobile edition (vercel.json); this catches the
      // devices it cannot tell from their user agent (iPads, which identify as Macs) before anything else loads.
      // An edition the visitor chose with the switch always wins, and /cinematic is never redirected.
      (function () { try {
        var l = location, ua = navigator.userAgent;
        if (l.pathname !== '/' || /(?:^|;\s*)pf-edition=/.test(document.cookie)) return;
        if (/Mobi|Android|iPhone|iPad|iPod|Silk|Kindle|KFAPWI|BlackBerry|BB10|Opera Mini|IEMobile|webOS|Tablet/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) { window.stop(); l.replace('/mobile' + l.search + l.hash); }
      } catch (e) { /* no redirect */ } })();
    </script>
